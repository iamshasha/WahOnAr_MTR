name: Build

# Fabric 1.19.4 only — the one target this server runs. Upstream built six Minecraft versions across three
# variations, for both loaders, and nothing else here is used.
#
# This workflow deliberately publishes nothing. Upstream's version uploaded builds over SFTP and pushed source
# strings to the original author's Crowdin project; both were removed. Builds are distributed privately from
# this server's own downloader, so a fork must not push anything anywhere.

on: [ pull_request, push ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
      - name: Validate gradle wrapper
        uses: gradle/wrapper-validation-action@main
      - name: Setup JDK 17
        uses: actions/setup-java@main
        with:
          java-version: 17
          distribution: 'zulu'
      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build Fabric 1.19.4
        run: ./gradlew :fabric:build -PbuildVersion=1.19.4
      - name: Check mixin annotation shapes
        # Refuses a jar compiled against a newer Mixin than the game runs. 3.3.09 shipped one of those and
        # crashed every client before the main menu, on source that had not changed a line.
        run: python checks/mixin_shape_check.py "$(ls fabric/build/libs/fabric-1.19.4-*.jar | grep -v dev-shadow | head -1)"
      - name: Capture jar
        uses: actions/upload-artifact@main
        with:
          name: MTR Fabric 1.19.4
          path: fabric/build/libs/*.jar
